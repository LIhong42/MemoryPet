<svg viewBox="0 0 100 100" width="160" height="160" xmlns="http://www.w3.org/2000/svg" aria-label="bird">
  <!-- Body -->
  <ellipse class="body" cx="50" cy="55" rx="22" ry="26" fill="#5cb6e8" stroke="#205a78" stroke-width="1.5"/>
  <!-- Belly highlight -->
  <ellipse cx="50" cy="62" rx="13" ry="14" fill="#a6dff5"/>
  <!-- Head -->
  <circle class="head" cx="50" cy="32" r="18" fill="#5cb6e8" stroke="#205a78" stroke-width="1.5"/>
  <!-- Wing -->
  <path class="wing" d="M 30 50 Q 50 40 70 50 Q 60 70 50 70 Q 40 70 30 50 Z" fill="#3a8bb0" stroke="#205a78" stroke-width="1.3"/>
  <!-- Eye -->
  <g class="eyes-open">
    <circle class="eye eye-l" cx="56" cy="30" r="3" fill="#222"/>
    <circle cx="57" cy="29" r="1" fill="#fff"/>
  </g>
  <g class="eyes-closed" style="display:none">
    <path d="M 53 30 Q 56 32 59 30" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Beak -->
  <polygon points="50,36 45,40 50,42" fill="#f3a93a" stroke="#a87a14" stroke-width="1"/>
  <!-- Tail -->
  <path class="tail" d="M 70 56 L 90 50 L 88 64 Z" fill="#3a8bb0" stroke="#205a78" stroke-width="1.3"/>
  <!-- Feet (perched) -->
  <path class="leg leg-l" d="M 42 82 L 42 88 M 38 88 L 46 88" fill="none" stroke="#a87a14" stroke-width="2" stroke-linecap="round"/>
  <path class="leg leg-r" d="M 58 82 L 58 88 M 54 88 L 62 88" fill="none" stroke="#a87a14" stroke-width="2" stroke-linecap="round"/>
</svg>
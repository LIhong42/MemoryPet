<svg viewBox="0 0 100 100" width="160" height="160" xmlns="http://www.w3.org/2000/svg" aria-label="cat">
  <!-- Body -->
  <ellipse class="body" cx="50" cy="65" rx="32" ry="28" fill="#f3c98a" stroke="#7a5a2c" stroke-width="1.5"/>
  <!-- Head -->
  <circle class="head" cx="50" cy="42" r="24" fill="#fadba4" stroke="#7a5a2c" stroke-width="1.5"/>
  <!-- Ears -->
  <polygon class="ear ear-l" points="28,28 36,12 44,28" fill="#fadba4" stroke="#7a5a2c" stroke-width="1.5"/>
  <polygon class="ear ear-r" points="56,28 64,12 72,28" fill="#fadba4" stroke="#7a5a2c" stroke-width="1.5"/>
  <polygon points="32,24 38,16 41,25" fill="#f8a7a7"/>
  <polygon points="59,24 62,16 68,25" fill="#f8a7a7"/>
  <!-- Eyes (open) -->
  <g class="eyes-open">
    <circle class="eye eye-l" cx="42" cy="42" r="3" fill="#222"/>
    <circle class="eye eye-r" cx="58" cy="42" r="3" fill="#222"/>
    <circle cx="42" cy="41" r="1" fill="#fff"/>
    <circle cx="58" cy="41" r="1" fill="#fff"/>
  </g>
  <!-- Eyes (closed) -->
  <g class="eyes-closed" style="display:none">
    <path d="M 38 42 Q 42 45 46 42" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 54 42 Q 58 45 62 42" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Cheeks -->
  <circle cx="35" cy="50" r="3" fill="#f8b4b4" opacity="0.7"/>
  <circle cx="65" cy="50" r="3" fill="#f8b4b4" opacity="0.7"/>
  <!-- Nose + mouth -->
  <polygon points="50,48 47,51 53,51" fill="#cc7766"/>
  <path d="M 50 51 Q 46 56 42 53" fill="none" stroke="#7a5a2c" stroke-width="1.3"/>
  <path d="M 50 51 Q 54 56 58 53" fill="none" stroke="#7a5a2c" stroke-width="1.3"/>
  <!-- Whiskers -->
  <line x1="20" y1="48" x2="32" y2="50" stroke="#7a5a2c" stroke-width="1"/>
  <line x1="20" y1="52" x2="32" y2="52" stroke="#7a5a2c" stroke-width="1"/>
  <line x1="80" y1="48" x2="68" y2="50" stroke="#7a5a2c" stroke-width="1"/>
  <line x1="80" y1="52" x2="68" y2="52" stroke="#7a5a2c" stroke-width="1"/>
  <!-- Paws -->
  <ellipse class="leg leg-l" cx="34" cy="88" rx="9" ry="6" fill="#f3c98a" stroke="#7a5a2c" stroke-width="1.5"/>
  <ellipse class="leg leg-r" cx="66" cy="88" rx="9" ry="6" fill="#f3c98a" stroke="#7a5a2c" stroke-width="1.5"/>
  <!-- Tail -->
  <path class="tail" d="M 78 70 Q 92 64 88 50" fill="none" stroke="#7a5a2c" stroke-width="6" stroke-linecap="round"/>
</svg>
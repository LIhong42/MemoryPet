<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>MemoryPet Pet</title>
  <link rel="stylesheet" href="css/pet.css" />
</head>
<body>
  <div class="pet-root" id="pet-root">
    <div class="pet-sprite" id="pet-sprite" data-state="NORMAL">
      <svg viewBox="0 0 100 100" width="160" height="160" aria-label="desktop pet">
        <!-- Body -->
        <ellipse cx="50" cy="65" rx="32" ry="28" fill="#f3c98a" stroke="#7a5a2c" stroke-width="1.5"/>
        <!-- Head -->
        <circle cx="50" cy="42" r="24" fill="#fadba4" stroke="#7a5a2c" stroke-width="1.5"/>
        <!-- Ears -->
        <polygon points="28,28 36,12 44,28" fill="#fadba4" stroke="#7a5a2c" stroke-width="1.5"/>
        <polygon points="56,28 64,12 72,28" fill="#fadba4" stroke="#7a5a2c" stroke-width="1.5"/>
        <polygon points="32,24 38,16 41,25" fill="#f8a7a7"/>
        <polygon points="59,24 62,16 68,25" fill="#f8a7a7"/>
        <!-- Eyes -->
        <circle id="eye-l" cx="42" cy="42" r="3" fill="#222"/>
        <circle id="eye-r" cx="58" cy="42" r="3" fill="#222"/>
        <circle cx="42" cy="41" r="1" fill="#fff"/>
        <circle cx="58" cy="41" r="1" fill="#fff"/>
        <!-- Cheeks -->
        <circle cx="35" cy="50" r="3" fill="#f8b4b4" opacity="0.7"/>
        <circle cx="65" cy="50" r="3" fill="#f8b4b4" opacity="0.7"/>
        <!-- Nose + mouth -->
        <polygon points="50,48 47,51 53,51" fill="#cc7766"/>
        <path d="M 50 51 Q 46 56 42 53" fill="none" stroke="#7a5a2c" stroke-width="1.3"/>
        <path d="M 50 51 Q 54 56 58 53" fill="none" stroke="#7a5a2c" stroke-width="1.3"/>
        <!-- Whiskers -->
        <line x1="20" y1="48" x2="32" y2="50" stroke="#7a5a2c" stroke-width="1"/>
        <line x1="20" y1="52" x2="32" y2="52" stroke="#7a5a2c" stroke-width="1"/>
        <line x1="80" y1="48" x2="68" y2="50" stroke="#7a5a2c" stroke-width="1"/>
        <line x1="80" y1="52" x2="68" y2="52" stroke="#7a5a2c" stroke-width="1"/>
        <!-- Paws -->
        <ellipse cx="34" cy="88" rx="9" ry="6" fill="#f3c98a" stroke="#7a5a2c" stroke-width="1.5"/>
        <ellipse cx="66" cy="88" rx="9" ry="6" fill="#f3c98a" stroke="#7a5a2c" stroke-width="1.5"/>
        <!-- Tail -->
        <path d="M 78 70 Q 92 64 88 50" fill="none" stroke="#7a5a2c" stroke-width="6" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="badge hidden" id="pet-badge">0</div>
    <div class="reminder-bubble hidden" id="pet-bubble"></div>
  </div>
  <script src="js/pet.js"></script>
</body>
</html>

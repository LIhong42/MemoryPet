<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>MemoryPet Pet</title>
  <link rel="stylesheet" href="css/pet.css" />
</head>
<body>
  <div class="pet-root" id="pet-root">
    <div class="pet-sprite" id="pet-sprite" data-state="NORMAL" data-species="cat" data-action="idle">
      <div class="svg-stage" id="stage-cat"></div>
      <div class="svg-stage hidden" id="stage-dog"></div>
      <div class="svg-stage hidden" id="stage-bird"></div>
      <div class="svg-stage hidden" id="stage-miku"></div>

      <!-- ZZZ badge shown while sleeping -->
      <div class="zzz hidden" id="zzz-badge">Z<span>z</span><span>z</span></div>
    </div>

    <!-- Reminder badge (corner count) + speech bubble above the sprite -->
    <div class="badge hidden" id="pet-badge">0</div>
    <div class="reminder-bubble hidden" id="pet-bubble"></div>
  </div>
  <script src="js/pet.js"></script>
</body>
</html>
